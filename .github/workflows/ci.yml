name: Phase 0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: ailhoung_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d ailhoung_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app_test:ephemeral-ci-only@localhost:5432/ailhoung_test
      JWT_SECRET: ephemeral-ci-only-signing-key-not-used-in-production
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npx --no-install prisma validate && npx --no-install prisma generate && npx --no-install prisma db push
        working-directory: backend
      - run: npm test
      - run: npm run build
      - run: npm run test:security:integration --prefix backend
      - run: npm run migrate:security --prefix backend && npm run migrate:phase0 --prefix backend && npm run migrate:phase0 --prefix backend && npm run migrate:auth --prefix backend && npm run migrate:auth --prefix backend
      - run: npm run test:phase0:integration --prefix backend
