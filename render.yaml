services:
  - type: web
    runtime: node
    name: ailhongdeploy-kritnarinp-test-api
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    buildFilter:
      paths:
        - backend/**
        - render.yaml
        - .github/workflows/ci.yml
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: FRONTEND_URL
        value: https://ailhongdeploy-kritnarinp-test-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: REFRESH_COOKIE_SAME_SITE
        value: lax
      - key: AI_USER_DAILY_LIMIT
        value: 10
      - key: AI_GLOBAL_DAILY_LIMIT
        value: 100

  - type: web
    runtime: static
    name: ailhongdeploy-kritnarinp-test-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
        - .github/workflows/ci.yml
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: VITE_API_URL
        value: /api
      - key: VITE_GEOCODE_URL
        value: https://photon.komoot.io/api/
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ailhongdeploy-kritnarinp-test-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' https://photon.komoot.io https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
